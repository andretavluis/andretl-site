name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push cancels the older run of the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # next/font/google downloads fonts at build time and has failed
      # intermittently, so retry the build up to 3 times.
      - name: Build static export
        run: |
          for attempt in 1 2 3; do
            npm run build && exit 0
            echo "Build attempt $attempt failed"
            sleep 5
          done
          exit 1

      - name: Verify static export
        run: |
          test -f out/index.html || { echo "out/index.html missing"; exit 1; }
          echo "Static export OK: $(find out -type f | wc -l) files"
